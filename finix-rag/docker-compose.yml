# FINIX RAG - Docker Compose with Security Infrastructure
# All services with TLS, authentication, and encryption

services:
  # ============================================================
  # Vector Database - Qdrant (with TLS + API key auth)
  # ============================================================
  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
      - ./config/qdrant:/qdrant/config:ro
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-finix-rag-secure-key-change-me}
    # NOTE: the qdrant image ships no shell/curl/wget, so an exec healthcheck always
    # reports "unhealthy" even though the service is fine. We rely on service_started
    # for dependents instead. (Qdrant is ready within a few seconds.)
    restart: unless-stopped

  # ============================================================
  # HashiCorp Vault - Transit Encryption Engine
  # ============================================================
  vault:
    image: hashicorp/vault:1.17
    ports:
      - "8200:8200"
    environment:
      # Dev mode: auto-initialized + auto-unsealed with a known root token, matching
      # VAULT_TOKEN in .env. The app enables the transit engine on connect. This is
      # for local/dev only — production must use a properly initialized, unsealed,
      # TLS-fronted Vault (see config/vault.hcl for the prod skeleton).
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-only-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-only-token}
    cap_add:
      - IPC_LOCK
    command: server -dev
    healthcheck:
      # `vault status` exits 0 only when unsealed; the vault binary is in the image.
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Open Policy Agent - Authorization Engine
  # ============================================================
  opa:
    # FIX: config/opa-policy.rego is written in Rego v0 syntax (no `if` before rule
    # bodies). `openpolicyagent/opa:latest` is now OPA 1.0+, which requires Rego v1
    # and crash-loops on the existing policy. Pin to the last 0.x release so the
    # policy runs as-is. (Long-term: migrate the .rego to Rego v1 and unpin.)
    image: openpolicyagent/opa:0.70.0
    ports:
      - "8181:8181"
    volumes:
      - ./config/opa-policy.rego:/policies/finix-authz.rego:ro
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies/finix-authz.rego"
    # NOTE: the distroless opa image has no wget/curl/shell, so an exec healthcheck
    # can't work; dependents use service_started. OPA is ready within ~1s.
    restart: unless-stopped

  # ============================================================
  # Redis - Caching & Session Store
  # ============================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-finix-redis-password} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-finix-redis-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # FINIX RAG Application
  # ============================================================
  finix-rag:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - uploaded_docs:/app/uploads
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN:-dev-only-token}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-finix-rag-secure-key-change-me}
      - OPA_URL=http://opa:8181
      - REDIS_URL=redis://:${REDIS_PASSWORD:-finix-redis-password}@redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - API_SECRET_KEY=${API_SECRET_KEY:-change-this-to-strong-random-key}
      - ENABLE_PII_MASKING=true
      - EMBEDDING_DEVICE=cpu
    depends_on:
      qdrant:
        condition: service_started
      vault:
        condition: service_healthy
      opa:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  qdrant_data:
    driver: local
  vault_data:
    driver: local
  redis_data:
    driver: local
  uploaded_docs:
    driver: local
