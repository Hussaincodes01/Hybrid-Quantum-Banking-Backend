version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/infra/db/query.sql"
    gen:
      go:
        package: "db"
        out: "internal/infra/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_empty_slices: true
